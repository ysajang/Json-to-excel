<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑몰 리뷰 수집기</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>🛒 쇼핑몰 리뷰 수집기</h1>
      <p class="subtitle">쿠팡·네이버 스마트스토어 상품 리뷰를 자동으로 수집합니다</p>
    </header>

    <div class="content">
      <!-- URL 입력 섹션 -->
      <div class="section">
        <label for="productUrl">상품 URL (쿠팡 또는 네이버 스마트스토어)</label>
        <input type="text" id="productUrl" placeholder="쿠팡 또는 네이버 스마트스토어 상품 URL 입력" autocomplete="off">
      </div>

      <!-- 별점 필터 섹션 (체크박스) -->
      <div class="section">
        <label>별점 필터</label>
        <div class="checkbox-group-container">
          <div class="checkbox-group">
            <input type="checkbox" id="ratingAll" name="ratingFilter" value="all" checked>
            <label for="ratingAll">모든 별점</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="rating5" name="ratingFilter" value="5">
            <label for="rating5">최고(5)</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="rating4" name="ratingFilter" value="4">
            <label for="rating4">좋음(4)</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="rating3" name="ratingFilter" value="3">
            <label for="rating3">보통(3)</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="rating2" name="ratingFilter" value="2">
            <label for="rating2">별로(2)</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="rating1" name="ratingFilter" value="1">
            <label for="rating1">나쁨(1)</label>
          </div>
        </div>
      </div>

      <!-- 상태 표시 -->
      <div id="status" class="status hidden"></div>

      <!-- 진행률 표시 -->
      <div id="progress" class="progress hidden">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="progressText" class="progress-text">0%</div>
      </div>


      <!-- 시작 버튼 -->
      <button id="startBtn" class="btn-primary">리뷰 수집 시작</button>
      <button id="stopBtn" class="btn-danger hidden">중지</button>

      <!-- 결과 섹션 -->
      <div id="results" class="results hidden">
        <div class="results-header">
          <h3>수집 완료!</h3>
          <div id="resultInfo"></div>
        </div>

        <!-- 리뷰 조회 탭 -->
        <div id="previewTab" class="tab-content active">
          <div class="preview-controls">
            <input type="text" id="searchInput" class="search-input" placeholder="리뷰 내용 검색...">
            <div class="sort-checkbox-container" title="정렬 기준">
              <div class="sort-checkbox-group">
                <input type="radio" id="sortDateDesc" name="sortSelect" value="date-desc" checked>
                <label for="sortDateDesc">날짜 최신순</label>
              </div>
              <div class="sort-checkbox-group">
                <input type="radio" id="sortDateAsc" name="sortSelect" value="date-asc">
                <label for="sortDateAsc">날짜 오래된순</label>
              </div>
              <div class="sort-checkbox-group">
                <input type="radio" id="sortRatingDesc" name="sortSelect" value="rating-desc">
                <label for="sortRatingDesc">평점 높은순</label>
              </div>
              <div class="sort-checkbox-group">
                <input type="radio" id="sortRatingAsc" name="sortSelect" value="rating-asc">
                <label for="sortRatingAsc">평점 낮은순</label>
              </div>
            </div>
            <button id="copyTableBtn" class="btn-copy" title="테이블을 클립보드에 복사">📋 복사</button>
          </div>
          <div id="reviewTableContainer" class="review-table-container">
            <table id="reviewTable" class="review-table">
              <thead>
                <tr>
                  <th>번호</th>
                  <th>날짜</th>
                  <th>작성자</th>
                  <th>평점</th>
                  <th>제목</th>
                  <th>내용</th>
                  <th>상품평가</th>
                </tr>
              </thead>
              <tbody id="reviewTableBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="prevPage" class="page-btn" disabled>이전</button>
            <span id="pageInfo" class="page-info">1 / 1</span>
            <button id="nextPage" class="page-btn" disabled>다음</button>
          </div>
        </div>

        <!-- 다운로드 탭 -->
        <div id="downloadTab" class="tab-content">
          <div class="button-group">
            <button id="downloadJson" class="btn-download">JSON 다운로드</button>
            <button id="downloadExcel" class="btn-download">CSV로 다운 받기</button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p class="version">버전 1.0.0</p>
    </footer>
  </div>

  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
